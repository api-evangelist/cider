name: Cider
description: >-
  Cider is a global direct-to-consumer digital-first fashion brand geared toward
  Gen Z shoppers, founded in 2020 and operating primarily at shopcider.com and
  through its mobile apps. Backed by Andreessen Horowitz (a16z), DST Global, and
  Greenoaks Capital, Cider reached unicorn valuation as a fast-fashion challenger
  to SHEIN, using a data- and community-driven, on-demand manufacturing model to
  offer trend-forward women's clothing and accessories worldwide. Cider is a
  consumer retailer; it publishes no public developer API, developer portal, or
  API documentation. This profile was surfaced as an a16z portfolio company and
  added to the API Evangelist network as a company record.
